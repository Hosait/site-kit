# Lean on purpose (spending is tracked): pull requests only, one job, 10-minute cap,
# superseded runs cancelled, no end-to-end tests (run those locally: pnpm test:e2e).
name: CI
on:
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**']
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: sitekit, POSTGRES_PASSWORD: sitekit, POSTGRES_DB: sitekit }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sitekit" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgres://sitekit:sitekit@127.0.0.1:5432/sitekit
      PAYLOAD_SECRET: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:unit
      - run: pnpm kit:theme-check
      - name: Block schema up to date
        run: pnpm kit:schema && git diff --exit-code schema/
      - name: Schema drift (site/config.ts or blocks changed without a migration)
        run: |
          pnpm payload migrate:create drift-check --skip-empty
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            echo "::error::The schema changed without a migration. Run: pnpm payload migrate:create <name>"
            exit 1
          fi
      # Every rebuild sets its own brand, so no brand value may end up as a database default.
      - name: A brand change in site/config.ts needs no migration
        run: |
          perl -pi -e "s/legalName: '[^']*'/legalName: 'Drift Check AS'/; s/country: '[^']*'/country: 'SE'/" site/config.ts
          if git diff --quiet site/config.ts; then
            echo "::error::Could not change brand.legalName and brand.country in site/config.ts"
            exit 1
          fi
          pnpm payload migrate:create brand-check --skip-empty
          git checkout site/config.ts
          if [ -n "$(git status --porcelain src/migrations)" ]; then
            cat src/migrations/*_brand_check.ts || true
            echo "::error::A brand value from site/config.ts is a database default. Use a function as defaultValue instead."
            exit 1
          fi
