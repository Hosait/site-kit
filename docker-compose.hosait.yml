# Produksjonsstack på Hosait (se hosait.json). Lokal utvikling bruker docker-compose.yml.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sitekit
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: sitekit
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sitekit']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512m, cpus: '0.5' }

  web:
    build: .
    environment:
      DATABASE_URL: postgres://sitekit:${DB_PASSWORD}@postgres:5432/sitekit
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PREVIEW_SECRET: ${PREVIEW_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      NEXT_PUBLIC_SERVER_URL: ${PUBLIC_URL}
      # «production» først når DNS for alle tre domener peker hit; ellers staging (noindex, ?site=).
      SITE_ORIGINS: ${SITE_ORIGINS:-staging}
      STAGING_HOST: ${STAGING_HOST:-}
      # Hosait setter commit for hver deploy; vises i /api/health.
      HOSAIT_COMMIT_SHORT: ${HOSAIT_COMMIT_SHORT:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-oslo}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    # Uten S3 (S3_BUCKET tom) lagres bilder og dokumenter her, og overlever nye deployer.
    volumes:
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1g, cpus: '1' }

volumes:
  postgres_data:
  uploads:
